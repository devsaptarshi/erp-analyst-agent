[project]
name = "erp-analyst-agent"
version = "0.1.0"
description = "A text-to-SQL analyst agent over a synthetic multi-tenant manufacturing ERP, with provable zero cross-tenant leakage."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.118.0",
    "uvicorn[standard]>=0.37.0",
    "sse-starlette>=3.0.2",
    "langgraph>=1.2.20,<2",
    "langgraph-checkpoint-postgres>=3.2.0,<4",
    "langchain-anthropic>=1.7.10,<2",
    "psycopg[binary]>=3.2.3",
    "pgvector>=0.3.6",
    "sqlglot>=30.30.0,<31",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.1",
    "faker>=30.8.2",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
    "psycopg-pool>=3.2.3",
    "langchain-openai>=1.7.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/erp_analyst"]
